name: Build iOS Tweak (Rootless)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos, LLD & SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fakeroot git perl clang-14 lld-14 llvm-14 unzip
          sudo ln -sf /usr/bin/clang-14 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-14 /usr/bin/clang++
          sudo ln -sf /usr/bin/lld-14 /usr/bin/ld64.lld
          GH="https://github.com"
          git clone --depth=1 --recursive --shallow-submodules "$GH/theos/theos.git" /home/runner/theos
          mkdir -p /home/runner/theos/toolchain/linux/iphone/bin
          for tool in /usr/bin/*; do
            ln -sf "$tool" "/home/runner/theos/toolchain/linux/iphone/bin/$(basename "$tool")"
          done
          curl -fL "$GH/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /home/runner/theos/toolchain/linux/iphone/bin/ldid
          chmod +x /home/runner/theos/toolchain/linux/iphone/bin/ldid
          mkdir -p /home/runner/theos/sdks
          curl -fL "$GH/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk /home/runner/theos/sdks/
          rm -rf sdks.zip sdks-master

      - name: Build Rootless DEB
        env:
          THEOS: /home/runner/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          SDK=$(ls -d /home/runner/theos/sdks/*.sdk | head -n 1)
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64" _THEOS_TARGET_CC="clang -target arm64-apple-ios15.0 -isysroot $SDK" _THEOS_TARGET_CXX="clang++ -target arm64-apple-ios15.0 -isysroot $SDK" _THEOS_TARGET_LDFLAGS="-target arm64-apple-ios15.0 -fuse-ld=/usr/bin/ld64.lld -Wl,-platform_version,ios,15.0,16.5 -isysroot $SDK -L$SDK/usr/lib -F$SDK/System/Library/Frameworks -F$SDK/System/Library/PrivateFrameworks"

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCam-Rootless-DEB
          path: packages/*.deb

name: Build iOS Tweak (Rootless)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Prebuilt Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fakeroot git perl clang lld unzip xz-utils
          mkdir -p /home/runner/theos
          curl -L https://github.com -o theos.tar.xz
          tar -xf theos.tar.xz -C /home/runner/theos
          rm -f theos.tar.xz
          mkdir -p /home/runner/theos/sdks
          curl -L https://github.com -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk /home/runner/theos/sdks/
          rm -rf sdks.zip sdks-master

      - name: Build Rootless DEB
        env:
          THEOS: /home/runner/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCam-Rootless-DEB
          path: packages/*.deb

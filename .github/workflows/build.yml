name: Build iOS Tweak (Rootless)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos, Toolchain & SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y curl fakeroot git perl clang lld unzip xz-utils
          GH="https://github.com"
          git clone --depth=1 --recursive --shallow-submodules "$GH/theos/theos.git" /home/runner/theos
          mkdir -p /home/runner/theos/toolchain/linux/iphone
          curl -fL "$GH/CRKatri/llvm-project/releases/download/swift-5.3.2-RELEASE/swift-5.3.2-RELEASE-ubuntu20.04.tar.xz" -o toolchain.tar.xz || \
          curl -fL "$GH/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma" -o toolchain.tar.lzma
          if [ -f toolchain.tar.xz ]; then
            tar -xf toolchain.tar.xz -C /home/runner/theos/toolchain/linux/iphone --strip-components=1
          else
            tar --lzma -xf toolchain.tar.lzma -C /home/runner/theos/toolchain/linux/iphone
          fi
          rm -f toolchain.tar.*
          mkdir -p /home/runner/theos/sdks
          curl -fL "$GH/theos/sdks/archive/refs/heads/master.zip" -o sdks.zip
          unzip -q sdks.zip
          mv sdks-master/*.sdk /home/runner/theos/sdks/
          rm -rf sdks.zip sdks-master

      - name: Build Rootless DEB
        env:
          THEOS: /home/runner/theos
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCam-Rootless-DEB
          path: packages/*.deb
